[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-sim"
version = "0.1.0"
description = "FEDS perimeter replay and drone monitoring environment for COMP3821"
requires-python = ">=3.11"
dependencies = ["geopandas>=1.1,<2", "shapely>=2.1,<3", "pyogrio>=0.11,<1", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fire-sim = "fire_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
